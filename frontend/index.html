<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VigIA – Sistema de Vigilancia</title>

  <!-- Bootstrap 5.3 Dark -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Custom styles -->
  <link rel="stylesheet" href="/app/css/style.css" />
</head>
<body>

<!-- Login overlay -->
<div id="loginOverlay" class="login-overlay d-none">
  <div class="card login-card shadow-lg">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill text-primary" style="font-size:3rem"></i>
        <h3 class="mt-2 fw-bold">VigIA</h3>
        <p class="text-muted small">Sistema de Vigilancia Residencial</p>
      </div>
      <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" id="loginUsername" class="form-control" placeholder="admin" required autocomplete="username" />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-key"></i></span>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">
          <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Main App Shell -->
<div id="appShell" class="d-none">
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-3 py-2">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle">
        <i class="bi bi-list"></i>
      </button>
      <i class="bi bi-shield-lock-fill text-primary fs-4"></i>
      <span class="navbar-brand mb-0 h1 fw-bold">VigIA</span>
      <span class="badge bg-success ms-1">EN VIVO</span>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span class="text-muted small d-none d-md-block" id="navbarClock"></span>
      <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle me-1"></i><span id="navbarUsername">admin</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#" onclick="App.navigate('settings')"><i class="bi bi-gear me-2"></i>Configuración</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="d-flex" style="height:calc(100vh - 56px)">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar bg-dark border-end border-secondary d-flex flex-column">
      <ul class="nav flex-column p-2 flex-grow-1">
        <li class="nav-item">
          <a class="nav-link sidebar-link" href="#" data-page="dashboard">
            <i class="bi bi-speedometer2"></i><span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link sidebar-link" href="#" data-page="camera">
            <i class="bi bi-camera-video"></i><span>Cámara en vivo</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link sidebar-link" href="#" data-page="residents">
            <i class="bi bi-people"></i><span>Residentes</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link sidebar-link" href="#" data-page="visitors">
            <i class="bi bi-person-badge"></i><span>Visitantes</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link sidebar-link" href="#" data-page="events">
            <i class="bi bi-journal-text"></i><span>Bitácora</span>
          </a>
        </li>
        <li class="nav-item mt-auto">
          <a class="nav-link sidebar-link" href="#" data-page="settings">
            <i class="bi bi-gear"></i><span>Configuración</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow-1 overflow-auto p-3 p-md-4" id="content">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Cargando...</p>
      </div>
    </main>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- App scripts -->
<script src="/app/js/api.js"></script>
<script src="/app/js/camera.js"></script>
<script src="/app/js/residents.js"></script>
<script src="/app/js/visitors.js"></script>
<script src="/app/js/events.js"></script>
<script src="/app/js/settings.js"></script>
<script src="/app/js/app.js"></script>
</body>
</html>
